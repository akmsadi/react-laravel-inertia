<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#2b6b2b"/>
      <stop offset="85%" stop-color="#0b220b"/>
    </radialGradient>
    <!-- Cricket ball gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="80%" stop-color="#9e1b26"/>
    </radialGradient>
    <!-- Drop shadow for ball -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <!-- Soft glow for text -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="600" height="600" rx="60" fill="url(#bgGrad)"/>
  <rect width="600" height="600" rx="60" fill="none" stroke="#6f9e6f" stroke-width="2" opacity="0.6"/>

  <!-- Decorative crest rings -->
  <circle cx="300" cy="300" r="260" fill="none" stroke="#a0c090" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3" transform="rotate(10 300 300)"/>
  <circle cx="300" cy="300" r="240" fill="none" stroke="#a0c090" stroke-width="1" opacity="0.2" transform="rotate(-5 300 300)"/>

  <!-- Cricket ball emblem -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="240" r="100" fill="url(#ballGrad)"/>
    <!-- Seam stitching -->
    <circle cx="300" cy="240" r="85" fill="none" stroke="#fff8e7" stroke-width="3" stroke-dasharray="10 12" opacity="0.9" transform="rotate(35 300 240)"/>
    <circle cx="300" cy="240" r="75" fill="none" stroke="#fff8e7" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.6" transform="rotate(-20 300 240)"/>
    <!-- Highlight -->
    <ellipse cx="270" cy="210" rx="30" ry="20" fill="#ffffff" opacity="0.15" transform="rotate(-20 270 210)"/>
  </g>

  <!-- Club name -->
  <text x="300" y="410" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" text-anchor="middle" fill="#f5ffe0" filter="url(#glow)" letter-spacing="2">WILLOW CC</text>
  <text x="300" y="460" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#b8d9a8" letter-spacing="8">EST. 1984</text>

  <!-- Small cricket icons (stumps, bails, bat) -->
  <g fill="#b1d0a0" opacity="0.9">
    <!-- Stumps -->
    <rect x="230" y="510" width="6" height="40" rx="3"/>
    <rect x="250" y="510" width="6" height="40" rx="3"/>
    <rect x="270" y="510" width="6" height="40" rx="3"/>
    <!-- Bails -->
    <rect x="228" y="505" width="50" height="6" rx="3"/>
    <!-- Bat -->
    <rect x="330" y="500" width="8" height="50" rx="4" transform="rotate(20 334 525)"/>
    <rect x="328" y="545" width="16" height="12" rx="4" transform="rotate(20 336 551)"/>
  </g>

  <!-- Caption -->
  <text x="580" y="580" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#aac0a0" opacity="0.6">⚡ 600×600 SVG logo</text>
</svg>